blueprint:
  name: Aqara H1 Double Rocker - Hue Light Control
  description: |
    Control Philips Hue lights with Aqara Wireless H1 Double Rocker switch.
    - Single press: Toggle respective light on/off
    - Double press: Turn respective light on at 100% brightness
  domain: automation
  input:
    switch_device:
      name: Aqara H1 Double Rocker
      description: Select your Aqara H1 switch
      selector:
        device:
          integration: mqtt
          manufacturer: Aqara
          model: Wireless Remote Switch H1 Double Rocker (WRS-R02)
    
    left_light:
      name: Left Button Light/Group
      description: Light or group to control with left button
      selector:
        entity:
          domain: light
    
    right_light:
      name: Right Button Light/Group
      description: Light or group to control with right button
      selector:
        entity:
          domain: light
    
    both_buttons_action:
      name: Both Buttons Action (Optional)
      description: What to do when both buttons are pressed together
      default: all_off
      selector:
        select:
          options:
            - label: Turn off both lights
              value: all_off
            - label: Turn on both lights
              value: all_on
            - label: Do nothing
              value: none

mode: restart
max_exceeded: silent

trigger:
  - platform: device
    device_id: !input switch_device
    domain: mqtt
    type: action
    subtype: single_left
    id: left_single
  
  - platform: device
    device_id: !input switch_device
    domain: mqtt
    type: action
    subtype: single_right
    id: right_single
  
  - platform: device
    device_id: !input switch_device
    domain: mqtt
    type: action
    subtype: double_left
    id: left_double
  
  - platform: device
    device_id: !input switch_device
    domain: mqtt
    type: action
    subtype: double_right
    id: right_double
  
  - platform: device
    device_id: !input switch_device
    domain: mqtt
    type: action
    subtype: single_both
    id: both_single

action:
  - choose:
      # Left button single press - toggle
      - conditions:
          - condition: trigger
            id: left_single
        sequence:
          - service: light.toggle
            target:
              entity_id: !input left_light
      
      # Right button single press - toggle
      - conditions:
          - condition: trigger
            id: right_single
        sequence:
          - service: light.toggle
            target:
              entity_id: !input right_light
      
      # Left button double press - turn on at 100% brightness
      - conditions:
          - condition: trigger
            id: left_double
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input left_light
            data:
              brightness_pct: 100
      
      # Right button double press - turn on at 100% brightness
      - conditions:
          - condition: trigger
            id: right_double
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input right_light
            data:
              brightness_pct: 100
      
      # Both buttons pressed
      - conditions:
          - condition: trigger
            id: both_single
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ both_buttons_action == 'all_off' }}"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id:
                        - !input left_light
                        - !input right_light
              
              - conditions:
                  - condition: template
                    value_template: "{{ both_buttons_action == 'all_on' }}"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id:
                        - !input left_light
                        - !input right_light
            default: []

variables:
  both_buttons_action: !input both_buttons_action
  left_light: !input left_light
  right_light: !input right_light

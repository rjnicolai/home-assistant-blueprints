blueprint:
  name: ZBMINI Switch Controls Smart Bulb (Toggle)
  description: ZBMINI switch toggles smart bulb state
  domain: automation
  input:
    zbmini_switch:
      name: ZBMINI Switch Entity
      selector:
        entity:
          domain: switch
    target_light:
      name: Smart Bulb
      selector:
        entity:
          domain: light
trigger:
  - platform: state
    entity_id: !input zbmini_switch
action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input target_light
            state: "on"
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input target_light
      - conditions:
          - condition: state
            entity_id: !input target_light
            state: "off"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_light
mode: single

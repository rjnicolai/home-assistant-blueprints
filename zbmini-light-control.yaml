blueprint:
  name: ZBMINI Switch Controls Smart Bulb (States Synced)
  description: ZBMINI relay state matches smart bulb state
  domain: automation
  input:
    zbmini_switch:
      name: ZBMINI Switch Entity
      selector:
        entity:
          domain: switch
    target_light:
      name: Smart Bulb
      selector:
        entity:
          domain: light

trigger:
  - platform: state
    entity_id: !input zbmini_switch

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input zbmini_switch
            state: "on"
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input target_light
      - conditions:
          - condition: state
            entity_id: !input zbmini_switch
            state: "off"
        sequence:
          - service: light.turn_off
            target:
              entity_id: !input target_light

mode: single

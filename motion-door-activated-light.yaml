blueprint:
  name: Door Entry Light with Motion
  description: Turn on light when door closes after being opened and motion is detected. Turn off only when door opens again and motion clears.
  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: The motion sensor that detects presence
      selector:
        entity:
          filter:
            - domain: binary_sensor
    door_sensor:
      name: Door Sensor
      description: The door/window sensor that detects entry
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: 
                - door
                - opening
    light_target:
      name: Light
      description: The light to control
      selector:
        target:
          entity:
            - domain: light
    door_timeout_on:
      name: Door Entry Timeout
      description: How long after door closes to still trigger the light on motion (seconds)
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds
    door_timeout_off:
      name: Door Exit Timeout
      description: How long after door opens to allow light to turn off (seconds)
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: seconds
    motion_timeout:
      name: Motion Timeout
      description: How long to wait after motion stops before turning off light
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: minutes

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_detected
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      minutes: !input motion_timeout
    id: motion_cleared

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_detected
          - condition: state
            entity_id: !input door_sensor
            state: "off"
          - condition: template
            value_template: >
              {{ (now() - states[door_sensor].last_changed).total_seconds() < door_timeout_on }}
        sequence:
          - service: light.turn_on
            target: !input light_target
      - conditions:
          - condition: trigger
            id: motion_cleared
          - condition: state
            entity_id: !input door_sensor
            state: "off"
          - condition: template
            value_template: >
              {{ (now() - states[door_sensor].last_changed).total_seconds() < door_timeout_off }}
        sequence:
          - service: light.turn_off
            target: !input light_target

variables:
  door_sensor: !input door_sensor
  door_timeout_on: !input door_timeout_on
  door_timeout_off: !input door_timeout_off

mode: restart

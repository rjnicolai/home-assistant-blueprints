blueprint:
  name: Keep No-Neutral Relay Online with Power Cycle
  description: >
    Automatically power cycles a light when a no-neutral relay (like Sonoff ZBMINI-L2) 
    goes offline. This provides enough current to restore the relay's power.
    
    Perfect for use with Philips Hue or other smart bulbs that enter deep sleep mode.
    
    Create one automation per relay-light pair.
  domain: automation
  input:
    relay_entity:
      name: Relay/Switch
      description: The relay that may go offline (e.g., Sonoff ZBMINI-L2)
      selector:
        entity:
          domain: switch
    light_entity:
      name: Light
      description: The light to briefly turn on to restore relay power
      selector:
        entity:
          domain: light
    unavailable_delay:
      name: Unavailable Delay
      description: How long the relay must be unavailable before triggering (prevents false alarms)
      default: 10
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: seconds
          mode: slider
    power_cycle_duration:
      name: Power Cycle Duration
      description: How long to turn the light on (in seconds)
      default: 2
      selector:
        number:
          min: 1
          max: 10
          unit_of_measurement: seconds
          mode: slider

trigger:
  - platform: state
    entity_id: !input relay_entity
    to: "unavailable"
    for:
      seconds: !input unavailable_delay

condition: []

action:
  - service: light.turn_on
    target:
      entity_id: !input light_entity
  - delay:
      seconds: !input power_cycle_duration
  - service: light.turn_off
    target:
      entity_id: !input light_entity

mode: queued
max: 10
